# Group mission: the short line is on the home page; the full version is on the Research page.
mission_short: We study how coastal geo-infrastructure fails under storms, erosion, and changing hydrology, and how to see it coming.
mission: We study how coastal geo-infrastructure fails under storms, erosion, and changing hydrology, and how to see it coming. The group couples granular mechanics with physics-informed machine learning, satellite and robotic sensing, and laboratory experiments to build digital twins for bluffs, foundations, bridges, and embankments.

